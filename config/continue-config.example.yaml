# Ejemplo de config para Continue (~/.continue/config.yaml)
# Autocomplete con el modelo FIM pequeño servido por Ollama.
name: sfcc-coder-local
version: 0.0.1
models:
  - name: qwen2.5-coder-fim
    provider: ollama
    apiBase: http://localhost:11434
    model: qwen2.5-coder:7b
    roles:
      - autocomplete
